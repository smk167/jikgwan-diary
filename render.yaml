services:
  - type: web
    name: jikgwan-diary-api
    runtime: node
    plan: free
    buildCommand: (cd frontend && npm install && npm run build) && (cd backend && npm install) && cp -r frontend/dist backend/public
    startCommand: node backend/src/index.js
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: NODE_ENV
        value: production
